name: Deploy Image

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      version:
        required: true
        type: string
      revision:
        required: true
        type: string
      digest:
        required: true
        type: string

permissions: {}

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      deployments: write
    env:
      TARGET: ${{ inputs.environment }}
      VERSION: ${{ inputs.version }}
      REVISION: ${{ inputs.revision }}
      DIGEST: ${{ inputs.digest }}
    steps:
      - name: Record the image deployment
        id: record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(jq -cn --arg ref "$REVISION" --arg target "$TARGET" --arg digest "$DIGEST" \
            --arg version "$VERSION" \
            '{ref: $ref, environment: $target, task: "acadflow-image", auto_merge: false,
              required_contexts: [], payload: {digest: $digest, version: $version}}' |
            gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id')
          [[ $id =~ ^[0-9]+$ ]]
          printf 'id=%s\n' "$id" >> "$GITHUB_OUTPUT"
      - name: Deploy through the restricted SSH command
        id: ssh
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          API_HOST_PORT: ${{ vars.API_HOST_PORT }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT || '5432' }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ vars.DB_DATABASE }}
          DB_SSL: ${{ vars.DB_SSL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_EXPIRES_IN: ${{ vars.JWT_ACCESS_EXPIRES_IN || '15m' }}
          I18N_FALLBACK_LANGUAGE: ${{ vars.I18N_FALLBACK_LANGUAGE || 'pt-BR' }}
        run: |
          set -euo pipefail
          [[ $DEPLOY_HOST =~ ^[[:alnum:]][[:alnum:].-]*$ ]]
          [[ $DEPLOY_PORT =~ ^[0-9]{1,5}$ ]] && ((10#$DEPLOY_PORT >= 1 && 10#$DEPLOY_PORT <= 65535))
          [[ -n $DEPLOY_SSH_KEY && -n $DEPLOY_KNOWN_HOSTS ]]
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          keys=(API_HOST_PORT CORS_ORIGIN DB_HOST DB_PORT DB_USERNAME DB_PASSWORD DB_DATABASE DB_SSL
            JWT_SECRET JWT_ACCESS_EXPIRES_IN I18N_FALLBACK_LANGUAGE)
          for key in "${keys[@]}"; do
            [[ -n ${!key} ]] || { printf 'Missing GitHub Environment setting: %s\n' "$key" >&2; exit 1; }
          done
          {
            for key in "${keys[@]}"; do printf '%s=%s\0' "$key" "${!key}"; done
          } | ssh -T -F /dev/null -i "$ssh_dir/key" -p "$DEPLOY_PORT" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
              -o GlobalKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              "root@$DEPLOY_HOST" "deploy $DIGEST"
      - name: Record the deployment result
        if: ${{ always() && steps.record.outputs.id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.record.outputs.id }}
          SSH_OUTCOME: ${{ steps.ssh.outcome }}
        run: |
          set -euo pipefail
          state=failure
          if [[ $SSH_OUTCOME == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state="$state" -F auto_inactive=false \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
