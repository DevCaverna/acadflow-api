name: Publish Snapshot

on:
  workflow_run:
    workflows: [AcadFlow API CI]
    branches: [develop, staging]
    types: [completed]

permissions: {}

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REVISION: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Build, verify and sign the candidate
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="snapshot-${REVISION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tree=$(git rev-parse 'HEAD^{tree}')
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build --file docker/Dockerfile --platform linux/amd64 --push \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --tag "$image:$tag" --metadata-file "$RUNNER_TEMP/image.json" .
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' \
            "$RUNNER_TEMP/image.json")
          trivy image --scanners vuln --severity CRITICAL --table-mode detailed --exit-code 1 "$image@$digest"
          trivy image --format spdx-json --output "$RUNNER_TEMP/sbom.spdx.json" "$image@$digest"
          cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/sbom.spdx.json" "$image@$digest"
          cosign sign --yes -a "revision=$REVISION" -a "tree=$tree" "$image@$digest"
          # shellcheck disable=SC2016
          printf '### Signed candidate\n\n`%s@%s`\n\nImage: `%s@%s`\n' \
            "$REVISION" "$digest" "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
