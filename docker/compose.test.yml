name: acadflow-tests

services:
  postgres:
    image: postgres:17-alpine
    environment:
      TZ: UTC
      POSTGRES_USER: ${POSTGRES_USER:-acadflow_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-test-only-change-me}
      POSTGRES_DB: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d postgres']
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
    networks: [testnet]

  test-runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: test
      TZ: UTC
      TEST_WORKERS: ${TEST_WORKERS:-4}
      TEST_DB_PREFIX: ${TEST_DB_PREFIX:-acadflow_test}
      TEST_SUITE: all
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-acadflow_test}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-test-only-change-me}
      DB_DATABASE: acadflow_test_1
      JWT_SECRET: test-only-do-not-use-in-production
    command: >
      sh -lc "node test/support/setup/prepare-test-dbs.mjs &&
      node scripts/run-vitest-suites.mjs"
    networks: [testnet]

networks:
  testnet:
